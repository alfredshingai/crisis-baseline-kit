name: pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # after the Monday baseline rebuild (03:00)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  list-countries:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.list.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          countries=$(python -c "import glob, json, os; print(json.dumps(sorted(os.path.basename(p)[:-5] for p in glob.glob('profiles/*.yaml'))))")
          echo "countries=$countries" >> "$GITHUB_OUTPUT"

  build:
    needs: list-countries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        country: ${{ fromJSON(needs.list-countries.outputs.countries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: cbk build ${{ matrix.country }} --out baselines
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.country }}
          path: baselines/${{ matrix.country }}/**
          if-no-files-found: error

  deploy:
    needs: [list-countries, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          path: baselines
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
