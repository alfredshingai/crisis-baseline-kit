# Country profile: Malawi (pilot)
# A profile fully describes one baseline: which sources, which admin levels,
# which quality gates, how the viewer is styled. Adding a country = adding a
# file like this one (plus adapters for any country-specific sources).

iso3: MWI
name: Malawi
profile_version: 0.1.0

# HDX dataset slug for OCHA administrative boundaries (COD-AB)
hdx_slug: cod-ab-mwi

# Projected CRS used for area/density calculations (UTM 36S fits Malawi best)
crs_analysis: "EPSG:32736"

layers:
  admin_boundaries:
    adapter: codab
    params:
      admin_levels: [0, 1, 2]

  population:
    adapter: worldpop
    params:
      year: 2020
      dataset: ppp        # "ppp" (unconstrained) or "ppp_UNadj" (UN-adjusted)

# Quality gate: the build FAILS (non-zero exit) if any expectation is violated.
checks:
  # Malawi COD-AB has 32 admin-2 units (28 districts + 4 cities); tolerate churn.
  expected_admin2_count: [28, 38]
  # WorldPop 2020 national total is ~18-19.5M depending on variant.
  expected_population_total_millions: [16.5, 21.5]

viewer:
  choropleth_field: population_sum
  choropleth_label: "Population (WorldPop 2020, unconstrained)"
