  # uncertainty is very large. WorldPop unconstrained models 16.8M. Gate
  # spans the credible range rather than +/-40% of one estimate.
  expected_population_total_millions: [8.0, 18.0]

viewer:
  choropleth_field: population_sum
  choropleth_label: "Population (WorldPop 2020, unconstrained)"
