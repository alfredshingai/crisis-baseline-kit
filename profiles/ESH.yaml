# Country profile: Western Sahara
# Generated by tools/gen_profiles.py from the 2026-10-25 source audit.

iso3: ESH
name: "Western Sahara"
profile_version: 0.3.0
hdx_slug: cod-ab-esh
crs_analysis: "ESRI:102022"

layers:
  admin_boundaries:
    adapter: codab
    params:
      admin_levels: [0, 1]        # ESH COD-AB stops at admin-1

  population:
    adapter: worldpop
    params:
      year: 2020
      dataset: ppp

  # Optional: skipped with a warning if this country has no healthsites dataset.
  facilities:
    adapter: healthsites
    optional: true

  # Optional: skipped where no Geofabrik extract exists (ESH).
  roads:
    adapter: roads
    optional: true

checks:
  # As built (COD-AB stops at admin-1; 4 units); +/-3 for source updates.
  expected_admin2_count: [1, 7]
  # UN WPP 2020 estimate: 0.58M; gate is +/-40% (min 0.10M wide).
  # WorldPop unconstrained can deviate further in forest-heavy states (e.g. Gabon runs ~30% high).
  expected_population_total_millions: [0.35, 0.81]

viewer:
  choropleth_field: population_sum
  choropleth_label: "Population (WorldPop 2020, unconstrained)"
