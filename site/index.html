<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crisis Baseline Kit — live baselines</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; }
  header { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
           padding: 10px 14px; background: rgba(255,255,255,.94);
           border-bottom: 1px solid #ddd; }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; margin: 3px 0 0; color: #555; }
  header a { color: #08519c; }
  #switcher { position: absolute; top: 64px; left: 14px; z-index: 2;
              background: rgba(255,255,255,.94); border: 1px solid #ddd;
              border-radius: 6px; overflow: hidden; }
  #switcher button { display: block; width: 100%; border: 0; background: none;
                     padding: 8px 14px; font-size: 13px; cursor: pointer;
                     text-align: left; }
  #switcher button.active { background: #08519c; color: #fff; font-weight: 600; }
  #switcher button:not(.active):hover { background: #eff3ff; }
  #legend { position: absolute; right: 10px; bottom: 10px; z-index: 2;
            background: rgba(255,255,255,.94); border: 1px solid #ddd;
            padding: 8px 10px; font-size: 12px; max-width: 240px; }
  #attrib { position: absolute; left: 10px; bottom: 10px; z-index: 2;
            background: rgba(255,255,255,.9); border: 1px solid #ddd;
            padding: 5px 8px; font-size: 11px; max-width: 420px; color: #444; }
  .swatch { display: inline-block; width: 12px; height: 12px;
            margin-right: 6px; vertical-align: -1px; }
  .maplibregl-popup td { padding: 2px 8px 2px 0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Crisis Baseline Kit</h1>
  <p id="subtitle">Loading baselines…</p>
</header>
<div id="switcher"></div>
<div id="map"></div>
<div id="legend"><b id="legend-title"></b><div id="legend-rows"></div></div>
<div id="attrib"></div>
<script>
const fmt = n => (n == null || Number.isNaN(Number(n))) ? "-" :
  Number(n).toLocaleString(undefined, {maximumFractionDigits: 0});
let map, currentLayerIds = [];

function clearLayers() {
  for (const id of currentLayerIds) { if (map.getLayer(id)) map.removeLayer(id); }
  for (const id of currentLayerIds) { if (map.getSource(id)) map.removeSource(id); }
  currentLayerIds = [];
}

async function loadCountry(iso) {
  const cfg = await fetch(`${iso}/viewer_config.json`).then(r => r.json());
  const [geojson, meta] = await Promise.all([
    fetch(`${iso}/${cfg.geojson || "admin2.geojson"}`).then(r => r.json()),
    fetch(`${iso}/meta.json`).then(r => r.json()),
  ]);
  document.getElementById("title").textContent =
    `${cfg.country} (${cfg.iso3}) \u2014 crisis baseline`;
  document.getElementById("subtitle").textContent =
    `${cfg.admin2_count} admin-2 units \u00b7 national population ` +
    `${fmt(cfg.total_population)} \u00b7 built ${cfg.date} \u00b7 ` +
    `<a href="https://github.com/alfredshingai/crisis-baseline-kit">source &amp; downloads</a>`;

  const colors = cfg.colors, b = cfg.breaks, field = cfg.field;
  const steps = [];
  for (let i = 0; i < colors.length; i++) {
    steps.push(colors[i]);
    if (i < b.length) steps.push(b[i]);
  }
  const fillColor = b.length ? ["step", ["get", field], ...steps] : colors[colors.length - 1];

  clearLayers();
  map.addSource("admin2", { type: "geojson", data: geojson });
  const firstSymbol = map.getStyle().layers.find(l => l.type === "symbol");
  const before = firstSymbol ? firstSymbol.id : undefined;
  map.addLayer({
    id: "admin2-fill", type: "fill", source: "admin2",
    paint: { "fill-color": fillColor, "fill-opacity": 0.75 },
  }, before);
  map.addLayer({
    id: "admin2-outline", type: "line", source: "admin2",
    paint: { "line-color": "#333", "line-width": 0.6 },
  }, before);
  currentLayerIds = ["admin2-fill", "admin2-outline"];

  const bounds = new maplibregl.LngLatBounds();
  for (const f of geojson.features) {
    const c = f.geometry.coordinates;
    const pts = f.geometry.type === "Polygon" ? c.flat(1) : c.flat(2);
    for (const p of pts) bounds.extend(p);
  }
  map.fitBounds(bounds, { padding: 40 });

  map.on("click", "admin2-fill", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<table>
        <tr><td><b>Unit</b></td><td>${p.adm2_name ?? "-"}</td></tr>
        <tr><td>P-code</td><td>${p.adm2_pcode ?? "-"}</td></tr>
        <tr><td>Population</td><td>${fmt(p.population_sum)}</td></tr>
        ${p.facility_count != null ? `<tr><td>Health facilities</td><td>${fmt(p.facility_count)} (${fmt(p.facilities_per_10k_pop)} per 10k)</td></tr>` : ""}
        <tr><td>Area (km\u00b2)</td><td>${fmt(p.area_km2)}</td></tr>
        <tr><td>Density (/km\u00b2)</td><td>${fmt(p.pop_density_km2)}</td></tr>
      </table>`)
      .addTo(map);
  });
  map.on("mouseenter", "admin2-fill", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "admin2-fill", () => map.getCanvas().style.cursor = "");

  document.getElementById("legend-title").textContent = cfg.label;
  const rows = document.getElementById("legend-rows");
  rows.innerHTML = "";
  for (let i = 0; i < colors.length; i++) {
    const lo = i === 0 ? null : b[i - 1];
    const hi = i < b.length ? b[i] : null;
    const label = lo == null ? `\u2264 ${fmt(hi)}` :
                  hi == null ? `> ${fmt(lo)}` : `${fmt(lo)} \u2013 ${fmt(hi)}`;
    const div = document.createElement("div");
    div.innerHTML = `<span class="swatch" style="background:${colors[i]}"></span>${label}`;
    rows.appendChild(div);
  }
  document.getElementById("attrib").innerHTML =
    "Data: " + meta.sources.map(s => `${s.attribution} (${s.license})`).join(" \u00b7 ");
}

fetch("countries.json").then(r => r.json()).then(countries => {
  map = new maplibregl.Map({
    container: "map",
    style: "https://demotiles.maplibre.org/style.json",
    center: [33.7, -13.2],
    zoom: 5,
  });
  const switcher = document.getElementById("switcher");
  for (const c of countries) {
    const btn = document.createElement("button");
    btn.textContent = c.name;
    btn.title = `${c.name} (${c.iso3}), baseline ${c.date}`;
    btn.onclick = () => {
      for (const b of switcher.children) b.classList.remove("active");
      btn.classList.add("active");
      loadCountry(c.iso3);
    };
    switcher.appendChild(btn);
  }
  map.on("load", () => {
    switcher.firstChild.classList.add("active");
    loadCountry(countries[0].iso3);
  });
});
</script>
</body>
</html>
